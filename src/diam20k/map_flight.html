<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ДИАМ‑20К · Полёт над картой</title>
<style>
  :root { color-scheme: dark; font: 16px system-ui, sans-serif; }
  body { max-width: 1100px; margin: auto; padding: 24px; background: #0d151a; color: #e6f3f3; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  p { margin: 0 0 16px; color: #b0c7cb; }
  canvas { display: block; width: 100%; height: clamp(340px, 59vh, 660px); border-radius: 10px; background: #111f26; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 12px 0; }
  button { padding: 8px 14px; border: 1px solid #526c75; border-radius: 5px; background: #22363d; color: inherit; cursor: pointer; font: inherit; }
  input { flex: 1 1 140px; accent-color: #57e0ba; }
  output { font-variant-numeric: tabular-nums; min-width: 8ch; }
  dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 8px; }
  dl div { background: #16252c; border-radius: 6px; padding: 10px; }
  dt { color: #b0c7cb; font-size: .83rem; }
  dd { margin: 4px 0 0; font-variant-numeric: tabular-nums; }
</style>
<main>
  <h1>ДИАМ‑20К · Полёт над картой</h1>
  <p>Учебный сценарий 6‑DOF. Бирюзовым показан пройденный путь, янтарным — препятствия.</p>
  <canvas id="map" aria-label="Карта препятствий, траектория и положение аппарата"></canvas>
  <div class="controls">
    <button id="play" type="button">Пуск</button>
    <button id="view" type="button" aria-pressed="false">Вид сверху</button>
    <input id="seek" type="range" min="0" step="1" value="0" aria-label="Позиция воспроизведения">
    <output id="time" for="seek"></output>
  </div>
  <dl id="telemetry"></dl>
  <p id="status" role="status"></p>
</main>
<script>
'use strict';
const data = /* FLIGHT_DATA */;
const canvas = document.querySelector('#map');
const ctx = canvas.getContext('2d');
const play = document.querySelector('#play');
const view = document.querySelector('#view');
const seek = document.querySelector('#seek');
const time = document.querySelector('#time');
const status = document.querySelector('#status');
const telemetry = document.querySelector('#telemetry');
const fields = ['Широта WGS 84', 'Долгота WGS 84', 'Высота над картой',
  'Высота WGS 84', 'Горизонтальная скорость', 'Скорость набора', 'Курс корпуса', 'Тангаж', 'Крен'];
const cells = fields.map(label => {
  const group = document.createElement('div');
  const term = document.createElement('dt');
  const value = document.createElement('dd');
  term.textContent = label;
  group.append(term, value);
  telemetry.append(group);
  return value;
});

const samples = data.samples;
const last = samples.length - 1;
const duration = samples[last].time;
seek.max = last;
let topView = false;
let playing = false;
let position = 0;
let startedAt = 0;

function footprint(box, down) {
  const [n0, e0] = box.minimum_ned;
  const [n1, e1] = box.maximum_ned;
  return [[n0,e0,down], [n1,e0,down], [n1,e1,down], [n0,e1,down]];
}

function plane([north, east, down]) {
  return topView ? [east, -north] : [east + .43 * north, .38 * east - .63 * north + down];
}

function draw() {
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  const ratio = window.devicePixelRatio || 1;
  if (canvas.width !== Math.round(width * ratio) || canvas.height !== Math.round(height * ratio)) {
    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
  }
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.clearRect(0, 0, width, height);

  const ground = footprint(data.bounds, 0);
  const limits = ground.concat(footprint(data.bounds, data.bounds.minimum_ned[2])).map(plane);
  const xs = limits.map(point => point[0]);
  const ys = limits.map(point => point[1]);
  const left = Math.min(...xs), right = Math.max(...xs);
  const top = Math.min(...ys), bottom = Math.max(...ys);
  const scale = Math.min((width - 44) / (right - left), (height - 64) / (bottom - top));
  const project = point => {
    const [x, y] = plane(point);
    return [width / 2 + (x - (left + right) / 2) * scale,
      height / 2 + (y - (top + bottom) / 2) * scale];
  };

  function path(points, stroke, fill, lineWidth = 1) {
    ctx.beginPath();
    ctx.moveTo(...project(points[0]));
    for (const point of points.slice(1)) ctx.lineTo(...project(point));
    if (fill) {
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
    }
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lineWidth;
    ctx.stroke();
  }

  path(ground, '#607b81', '#192e36');
  const [n0,e0] = data.bounds.minimum_ned;
  const [n1,e1] = data.bounds.maximum_ned;
  for (let n = Math.ceil(n0 / 100) * 100; n < n1; n += 100) {
    path([[n,e0,0], [n,e1,0]], '#29454d');
  }
  for (let e = Math.ceil(e0 / 100) * 100; e < e1; e += 100) {
    path([[n0,e,0], [n1,e,0]], '#29454d');
  }
  const obstacles = [...data.obstacles].sort((a, b) =>
    plane(a.minimum_ned)[1] - plane(b.minimum_ned)[1]);
  for (const box of obstacles) {
    const base = footprint(box, 0), roof = footprint(box, box.minimum_ned[2]);
    if (!topView) {
      path([base[0], base[3], roof[3], roof[0]], '#ad8153', '#664528');
      path([base[2], base[3], roof[3], roof[2]], '#ad8153', '#805631');
    }
    path(roof, '#d69f60', '#aa7342');
    const center = roof[0].map((value, i) => (value + roof[2][i]) / 2);
    const [x, y] = project(center);
    ctx.fillStyle = '#fff4de';
    ctx.font = '12px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(`${-center[2]} м`, x, y + 4);
  }

  const sample = samples[position];
  path(samples.map(row => row.ned), '#6a8790', null, 2);
  path(samples.slice(0, position + 1).map(row => row.ned), '#57e0ba', null, 3);
  const [north, east] = sample.ned;
  path([[north,east,0], sample.ned], '#bed5db');

  const [goalX, goalY] = project(data.goal);
  ctx.strokeStyle = '#f3e8c7';
  ctx.strokeRect(goalX - 4, goalY - 4, 8, 8);
  const modelSize = 11 / scale;
  const bodyPoint = point => sample.attitude.map((row, axis) =>
    sample.ned[axis] + modelSize * row.reduce((sum, component, col) =>
      sum + component * point[col], 0));
  const silhouette = [[1.3,0,0], [.25,.22,0], [-.38,1,0], [-.53,1,0],
    [-.28,.18,0], [-.86,.24,0], [-.86,-.24,0], [-.28,-.18,0],
    [-.53,-1,0], [-.38,-1,0], [.25,-.22,0]];
  path(silhouette.map(bodyPoint), '#e8fff8', '#57e0ba', 1.5);
  path([[.8,0,0], [-.8,0,0]].map(bodyPoint), '#295751');

  ctx.fillStyle = '#b4cbd1';
  ctx.textAlign = 'left';
  ctx.font = '12px system-ui';
  ctx.fillText('Сетка · 100 м', 14, 21);
  const [x0, y0] = project([0,0,0]);
  const [xn, yn] = project([100,0,0]);
  const length = Math.hypot(xn - x0, yn - y0);
  const dx = 23 * (xn - x0) / length, dy = 23 * (yn - y0) / length;
  ctx.beginPath();
  ctx.moveTo(width - 40, 45);
  ctx.lineTo(width - 40 + dx, 45 + dy);
  ctx.strokeStyle = '#b4cbd1';
  ctx.stroke();
  ctx.fillText('С', width - 43 + dx, 39 + dy);
}

function update() {
  seek.value = position;
  const {geo: [lat, lon, height], ned, velocity: [vn, ve, vd], attitude, time: t} = samples[position];
  const degrees = angle => angle * 180 / Math.PI;
  const heading = (degrees(Math.atan2(attitude[1][0], attitude[0][0])) + 360) % 360;
  const pitch = degrees(Math.asin(Math.max(-1, Math.min(1, -attitude[2][0]))));
  const roll = degrees(Math.atan2(attitude[2][1], attitude[2][2]));
  const values = [`${lat.toFixed(6)}°`, `${lon.toFixed(6)}°`, `${(-ned[2]).toFixed(1)} м`,
    `${height.toFixed(1)} м`, `${Math.hypot(vn, ve).toFixed(1)} м/с`,
    `${(-vd).toFixed(1)} м/с`, ...[heading, pitch, roll].map(angle => `${angle.toFixed(1)}°`)];
  cells.forEach((cell, i) => { cell.textContent = values[i]; });
  time.value = `${t.toFixed(1)} / ${duration.toFixed(1)} с`;
  const message = position === last ? data.status : '';
  if (status.textContent !== message) status.textContent = message;
  draw();
}

let animation;
function frame(now) {
  const elapsed = (now - startedAt) / 1000;
  position = elapsed >= duration ? last : Math.floor(elapsed / samples[1].time);
  update();
  if (position < last) animation = requestAnimationFrame(frame);
  else stop();
}
function stop() {
  cancelAnimationFrame(animation);
  playing = false;
  play.textContent = 'Пуск';
}
play.disabled = last === 0;
play.addEventListener('click', () => {
  if (playing) {
    stop();
    return;
  }
  if (position === last) position = 0;
  startedAt = performance.now() - samples[position].time * 1000;
  playing = true;
  play.textContent = 'Пауза';
  animation = requestAnimationFrame(frame);
});
seek.addEventListener('input', () => {
  stop();
  position = Number(seek.value);
  update();
});
view.addEventListener('click', () => {
  topView = !topView;
  view.setAttribute('aria-pressed', topView);
  draw();
});
new ResizeObserver(draw).observe(canvas);
update();
</script>
</html>
